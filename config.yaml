# TrojanLens configuration.  Paths are relative to the repo root (trojanlens_sim/).
# This is the consolidated working config (all fixes folded in).

model:
  # 0.5B is the safe local default on a 16GB M1. On a GPU (Colab) switch to
  # "Qwen/Qwen2.5-Coder-1.5B" (or 7B) and set device: "cuda", dtype: "bfloat16".
  name: "Qwen/Qwen2.5-Coder-0.5B"
  device: "mps"            # "mps" Apple Silicon | "cpu" | "cuda" on cloud
  dtype: "float32"         # float32 is fastest on CPU/MPS here; use bf16 on GPU
  max_seq_len: 2048        # per-window token budget (raise on GPU)
  chunk_overlap: 128       # sliding-window overlap for long modules (AES)

# LoRA (peft) — used when you enable real fine-tuning (cloud). The local
# experiment freezes the backbone and trains lightweight heads instead.
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  learning_rate: 2.0e-4
  batch_size: 1
  epochs: 12
  focal_gamma: 2.0
  focal_alpha: 0.75
  loc_pos_weight: 8.0
  grad_clip: 1.0
  seed: 1234

# Verification (Steps 7-8). Tuned so localization/VR are measurable on the pilot.
verify:
  top_k: 15                # cited lines (raise to cover multi-line Trojans)
  tau_g: 0.3               # attribution-grounding threshold
  tau_c: 0.05              # comprehensiveness drop threshold
  mask_strategy: "pad"
  attribution: "gradxinput"  # "gradxinput" (fast, default) or "ig" (full IG; use on GPU)

paths:
  toy_dir: "data/trusthub_rs232"
  labels: "data/trusthub_rs232/labels.jsonl"
  processed: "data/processed/combined.jsonl"   # built by the --sources combine step
  runs: "runs"
  predictions: "runs/predictions.jsonl"
